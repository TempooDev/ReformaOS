<app-modal [isOpen]="notificationService.isOpen()" 
           [title]="notificationService.notification()?.title || ''" 
           maxWidth="max-w-sm" 
           [showCloseButton]="false"
           (close)="notificationService.close()">
    
    <div class="text-center py-4">
        <div class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 transition-all"
             [ngClass]="getColorClass(notificationService.notification()?.type || 'info')">
            <span class="material-symbols-outlined text-4xl">
                {{ getIcon(notificationService.notification()?.type || 'info') }}
            </span>
        </div>
        
        <p class="text-on-surface-variant font-medium text-sm leading-relaxed mb-8 px-4">
            {{ notificationService.notification()?.message }}
        </p>

        <button (click)="notificationService.close()" 
                class="w-full py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all shadow-lg hover:scale-[1.02] active:scale-95"
                [ngClass]="getButtonClass(notificationService.notification()?.type || 'info')">
            Entendido
        </button>
    </div>

</app-modal>
